<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$TITLE</title>
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --accent: #d4a853;
      --accent-glow: rgba(212, 168, 83, 0.3);
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    .presentation {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 80px;
      opacity: 0;
      transform: translateX(100%);
      transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      pointer-events: none;
      background: var(--bg-primary);
    }

    .slide.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: all;
    }

    .slide.prev {
      opacity: 0;
      transform: translateX(-100%);
    }

    .slide-title {
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 20px;
      line-height: 1.2;
      text-align: center;
    }

    .slide-subtitle {
      font-size: clamp(0.9rem, 1.8vw, 1.3rem);
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-align: center;
    }

    .slide-content {
      font-size: clamp(0.9rem, 1.5vw, 1.2rem);
      color: var(--text-secondary);
      line-height: 1.8;
      max-width: 800px;
      text-align: center;
    }

    .slide-content ul {
      list-style: none;
      text-align: left;
    }

    .slide-content ul li {
      padding: 8px 0;
      padding-left: 24px;
      position: relative;
    }

    .slide-content ul li::before {
      content: '▸';
      color: var(--accent);
      position: absolute;
      left: 0;
      font-weight: bold;
    }

    .accent { color: var(--accent); }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      max-width: 900px;
      width: 100%;
      margin-top: 30px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      backdrop-filter: blur(10px);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px var(--accent-glow);
    }

    .card-icon {
      font-size: 2.5rem;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Controls */
    .controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      padding: 10px 24px;
      border-radius: 50px;
      border: 1px solid var(--border);
    }

    .controls button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 5px 10px;
      transition: color 0.3s;
    }

    .controls button:hover { color: var(--accent); }

    .slide-counter {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
      min-width: 60px;
      text-align: center;
    }

    /* 키보드 힌트 */
    .keyboard-hint {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: var(--text-secondary);
      opacity: 0.5;
      z-index: 100;
    }

    /* 애니메이션 */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
      50% { box-shadow: 0 0 40px var(--accent-glow); }
    }

    .slide.active .slide-title { animation: fadeInUp 0.6s 0.2s both; }
    .slide.active .slide-subtitle { animation: fadeInUp 0.6s 0.4s both; }
    .slide.active .slide-content { animation: fadeInUp 0.6s 0.6s both; }
    .slide.active .card-grid { animation: fadeInUp 0.6s 0.5s both; }
    .slide.active .card { animation: scaleIn 0.5s both; }
    .slide.active .card:nth-child(1) { animation-delay: 0.3s; }
    .slide.active .card:nth-child(2) { animation-delay: 0.5s; }
    .slide.active .card:nth-child(3) { animation-delay: 0.7s; }
    .slide.active .card:nth-child(4) { animation-delay: 0.9s; }

    /* 배경 데코 */
    .bg-decoration {
      position: absolute;
      border-radius: 50%;
      background: var(--accent-glow);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .slide > * { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div class="presentation">
    <!-- 슬라이드들이 여기에 들어갑니다 -->
    <!-- $SLIDES -->
  </div>

  <div class="controls">
    <button class="prev-btn" aria-label="이전">◀</button>
    <span class="slide-counter">1 / 1</span>
    <button class="next-btn" aria-label="다음">▶</button>
  </div>
  <div class="keyboard-hint">← → 방향키로 이동 | F 전체화면</div>

  <script>
    class Presentation {
      constructor() {
        this.slides = document.querySelectorAll('.slide');
        this.currentSlide = 0;
        this.totalSlides = this.slides.length;
        this.isTransitioning = false;
        this.init();
      }

      init() {
        document.addEventListener('keydown', (e) => {
          if (this.isTransitioning) return;
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
            e.preventDefault();
            this.next();
          }
          if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            this.prev();
          }
          if (e.key === 'f' || e.key === 'F') {
            this.toggleFullscreen();
          }
          if (e.key === 'Escape') {
            if (document.fullscreenElement) document.exitFullscreen();
          }
        });

        document.querySelector('.prev-btn')?.addEventListener('click', () => this.prev());
        document.querySelector('.next-btn')?.addEventListener('click', () => this.next());

        let startX = 0;
        document.addEventListener('touchstart', (e) => startX = e.touches[0].clientX);
        document.addEventListener('touchend', (e) => {
          const diffX = startX - e.changedTouches[0].clientX;
          if (Math.abs(diffX) > 50) diffX > 0 ? this.next() : this.prev();
        });

        this.updateCounter();

        // 3초 후 키보드 힌트 페이드아웃
        setTimeout(() => {
          const hint = document.querySelector('.keyboard-hint');
          if (hint) hint.style.transition = 'opacity 1s';
          if (hint) hint.style.opacity = '0';
        }, 3000);
      }

      goTo(index) {
        if (index < 0 || index >= this.totalSlides || this.isTransitioning) return;
        this.isTransitioning = true;

        const current = this.slides[this.currentSlide];
        const target = this.slides[index];

        current.classList.remove('active');
        if (index > this.currentSlide) {
          current.classList.add('prev');
        }

        target.classList.remove('prev');
        target.classList.add('active');

        this.currentSlide = index;
        this.updateCounter();

        setTimeout(() => {
          this.isTransitioning = false;
          this.slides.forEach((slide, i) => {
            if (i !== this.currentSlide) {
              slide.classList.remove('active', 'prev');
            }
          });
        }, 650);
      }

      next() { this.goTo(this.currentSlide + 1); }
      prev() { this.goTo(this.currentSlide - 1); }

      updateCounter() {
        const counter = document.querySelector('.slide-counter');
        if (counter) counter.textContent = `${this.currentSlide + 1} / ${this.totalSlides}`;
      }

      toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => new Presentation());
  </script>
</body>
</html>
